      {id:98, cat:"koylak", brand:"SUNFLOWER",      name:"Logo Longsleeve Tee",        price:"$95",  colors:["#f5f0e8","#c4a882","#1a1a2e"], img:"img/08-striped-longsleeve.jpg"},
      {id:99, cat:"sviter", brand:"JOHN SMEDLEY",   name:"Lundy Sea Island Cotton",    price:"$220", colors:["#1a1a2e","#c4a882","#2d4a2d"], img:"img/05-ribbed-knit-pullover.jpg"},
      {id:100,cat:"kurtak", brand:"NANAMICA",       name:"ALPHADRY Coach Jacket",      price:"$485", colors:["#1a2a4a","#1a1a1a","#2d4a2d"], img:"img/11-detroit-work-jacket.jpg"}
    ];

    let activeFilter = "all";
    let selectedId = 1;

    function getFiltered() {
      return activeFilter === "all" ? items : items.filter(i => i.cat === activeFilter);
    }

    function setFeatured(item) {
      selectedId = item.id;
      const img = document.getElementById("featuredImg");
      img.style.opacity = "0";
      img.src = item.img;
      img.alt = item.name;
      img.onload = () => { img.style.opacity = "1"; };
      document.getElementById("featuredBrand").textContent = item.brand;
      document.getElementById("featuredName").textContent = item.name;
      document.getElementById("featuredPrice").textContent = item.price;
      const glow = document.getElementById("featuredGlow");
      glow.style.background = `radial-gradient(ellipse 80% 80% at 50% 50%, ${item.colors[0]}44 0%, transparent 70%)`;
      const colorRow = document.getElementById("colorRow");
      colorRow.innerHTML = item.colors.map((c,i) =>
        `<span class="dot${i===0?' active':''}" style="background:${c}" title="${c}"></span>`
      ).join("");
      colorRow.querySelectorAll(".dot").forEach(dot => {
        dot.addEventListener("click", function() {
          colorRow.querySelectorAll(".dot").forEach(d => d.classList.remove("active"));
          this.classList.add("active");
          glow.style.background = `radial-gradient(ellipse 80% 80% at 50% 50%, ${this.style.background}44 0%, transparent 70%)`;
        });
      });
      document.querySelectorAll(".item-card").forEach(c => {
        c.classList.toggle("selected", parseInt(c.dataset.id) === item.id);
      });
    }

    function renderGrid() {
      const grid = document.getElementById("itemsGrid");
      const list = getFiltered();
      if (list.length === 0) {
        grid.innerHTML = '<p class="empty-msg">Kiyimlar topilmadi</p>';
        return;
      }
      grid.innerHTML = list.map(item => `
        <div class="item-card${item.id===selectedId?' selected':''}" data-id="${item.id}">
          <div class="card-img-wrap">
            <img src="${item.img}" alt="${item.name}" loading="lazy" />
            <div class="card-overlay">
              <span class="card-overlay-name">${item.name}</span>
              <span class="card-overlay-price">${item.price}</span>
            </div>
          </div>
          <div class="card-meta">
            <p class="card-brand">${item.brand}</p>
            <p class="card-name">${item.name}</p>
            <p class="card-price">${item.price}</p>
          </div>
        </div>
      `).join("");
      grid.querySelectorAll(".item-card").forEach(card => {
        card.addEventListener("click", () => {
          const found = items.find(i => i.id === parseInt(card.dataset.id));
          if (found) {
            setFeatured(found);
            grid.querySelectorAll(".item-card").forEach(c => c.classList.remove("selected"));
            card.classList.add("selected");
            if (window.innerWidth < 768) {
              document.querySelector(".featured-section").scrollIntoView({behavior:"smooth"});
            }
          }
        });
      });
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderGrid();
        const list = getFiltered();
        if (list.length > 0 && !list.find(i => i.id === selectedId)) {
          setFeatured(list[0]);
        }
      });
    });

    setFeatured(items[0]);
    renderGrid();
  </script>
</body>
</html>
